name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system deps
        run: |
          sudo apt-get update
          # protobuf-compiler (SETUP.md Step 1.1): grpcio-tools bundles its own
          # protoc for `python -m grpc_tools.protoc`, but protoletariat's
          # import-rewriting step shells out to a `protoc` binary on PATH --
          # that call needs the real apt package, not just the pip one.
          sudo apt-get install -y build-essential cmake autoconf automake libtool protobuf-compiler

      - name: Cache ODE
        id: ode-cache
        uses: actions/cache@v4
        with:
          # Staged under $HOME, not /usr/local: actions/cache extracts as the
          # unprivileged runner user and cannot write into root-owned /usr/local.
          path: ~/ode-install
          key: ode-0.16.2-double-${{ runner.os }}

      - name: Build ODE
        if: steps.ode-cache.outputs.cache-hit != 'true'
        env:
          ODE_SHA256: b26aebdcb015e2d89720ef48e0cb2e8a3ca77915f89d853893e7cc861f810f22
        run: |
          set -euo pipefail
          cd /tmp
          # Two sources for the identical tarball (verified byte-identical by
          # sha256). Bitbucket downloads intermittently reject CI egress with a
          # server error, so fall back to the Debian mirror of the same upstream
          # orig tarball. Never -q: it hides the HTTP error behind exit code 8.
          for url in \
            https://bitbucket.org/odedevs/ode/downloads/ode-0.16.2.tar.gz \
            https://deb.debian.org/debian/pool/main/o/ode/ode_0.16.2.orig.tar.gz
          do
            echo "Trying $url"
            if curl -fSL --retry 3 --retry-all-errors --retry-delay 5 \
                    --connect-timeout 20 --max-time 300 \
                    -o ode-0.16.2.tar.gz "$url"; then
              echo "Downloaded from $url"
              break
            fi
            echo "Failed: $url"
          done
          echo "${ODE_SHA256}  ode-0.16.2.tar.gz" | sha256sum -c -
          tar -xzf ode-0.16.2.tar.gz && cd ode-0.16.2
          ./configure --enable-double-precision --with-box-cylinder=libccd \
                      --enable-libccd --enable-shared --disable-demos
          make -j"$(nproc)"
          make install DESTDIR="$HOME/ode-install"

      - name: Install ODE
        run: |
          set -euo pipefail
          sudo cp -a "$HOME/ode-install/usr/local/." /usr/local/
          sudo ldconfig
          test "$(pkg-config --modversion ode)" = "0.16.2"
          test "$(pkg-config --variable=libdir ode)" = "/usr/local/lib"
          grep -q dDOUBLE /usr/local/include/ode/precision.h
          echo "ODE 0.16.2 double-precision at /usr/local/lib — OK"

      - uses: astral-sh/setup-uv@v3
      - run: uv venv --python 3.11
      # Each `run:` step is a fresh shell, so `uv pip install` alone never
      # activates the venv for later steps -- make proto/lint/test would
      # silently fall through to system python otherwise. Putting the venv's
      # bin on PATH here makes every subsequent step use it.
      - run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e ".[dev]"
      - run: uv pip install -e third_party/rsim
      - run: make proto
      - run: make lint
      - run: make test
