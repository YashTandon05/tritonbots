[project]
name = "tbots"
version = "0.1.0"
description = "RoboCup SSL Division B team software"
requires-python = ">=3.11,<3.12"

dependencies = [
  "numpy>=1.26",
  "protobuf>=4.25",
  "gymnasium>=0.29",
  "pyyaml>=6.0",
  "hydra-core>=1.3",
  "pygame>=2.5",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "wandb>=0.16",
  "tensorboard>=2.15",
]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.2",
  "ruff>=0.4",
  "grpcio-tools>=1.60",
  "protoletariat>=3.2",
  "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
