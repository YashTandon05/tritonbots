[project]
name = "tbots"
version = "0.1.0"
description = "RoboCup SSL Division B team software"
requires-python = ">=3.11,<3.12"

dependencies = [
  "numpy>=1.26",
  "protobuf>=4.25",
  "gymnasium>=0.29",
  "pyyaml>=6.0",
  "hydra-core>=1.3",
  "pygame>=2.5",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "wandb>=0.16",
  "tensorboard>=2.15",
]
dev = [
  "pytest>=8.0",
  "pytest-timeout>=2.2",
  "ruff>=0.4",
  "grpcio-tools>=1.60",
  "protoletariat>=3.2",
  "mypy>=1.9",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

# PIN THE RULE SET. Without an explicit `select`, ruff lints against whatever
# its current release considers default, so a routine `uv pip install -e .[dev]`
# can turn CI red without a line of our code changing. Adding a rule family here
# is a deliberate decision; drifting into one is not.
#
# Deliberately excluded: RUF and FURB. Both are opinionated and churny, and the
# only two findings they produced against this codebase were noise --
# `int(round(...))` in backends/rsim.py (removed by TASK-070; the timestep is a
# float now), and RUF012 on SSLEnv.metadata, which is the Gymnasium convention
# and is typed as a plain dict by gym.Env itself.
[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort — import order
  "UP",   # pyupgrade — keep us on 3.11 idiom
  "B",    # flake8-bugbear — real bug patterns
  "C4",   # flake8-comprehensions
]

# mypy needs to be told where the package lives. Without `mypy_path`, checking
# a file that imports `tbots` from outside src/ resolves nothing: the editable
# install is a .pth, which mypy does not execute. Combined with
# --ignore-missing-imports that fails SILENTLY -- every tbots name becomes Any
# and the check passes having verified nothing. Found the hard way on
# 2026-09-07; see docs/SETUP_LOG.md, TASK-072.
[tool.mypy]
python_version = "3.11"
mypy_path = "src"

# robosim is our compiled pybind11 extension. It ships no stubs and no
# py.typed marker, and it is the ONLY import we silence -- deliberately
# narrow, so a genuinely missing dependency still fails.
[[tool.mypy.overrides]]
module = ["robosim", "robosim.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
